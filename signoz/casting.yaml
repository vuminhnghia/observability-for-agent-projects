apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    mode: docker
    flavor: compose

  signoz:
    spec:
      env:
        SIGNOZ_TOKENIZER_JWT_SECRET: "${SIGNOZ_JWT_SECRET}"   # from signoz/.env, see .env.example

  # Hard caps inside ClickHouse itself. These must stay below the container mem_limit
  # set further down, so ClickHouse rejects work on its own terms instead of being
  # OOM-killed by the kernel - which would not promise to pick ClickHouse as the victim
  # on a host shared with customer-facing services.
  telemetrystore:
    spec:
      config:
        data:
          config-0-0.yaml: |
            max_server_memory_usage: 4294967296             # 4 GiB
            max_server_memory_usage_to_ram_ratio: 1         # do not scale with host RAM
            mark_cache_size: 536870912                      # 512 MiB (default is 5 GiB)

            # system.metric_log has 1552 columns. A Horizontal merge over Wide parts opens
            # one write buffer per column, about 3.7 GiB per merge, which exceeds the 4 GiB
            # cap above and fails; the failure is retried immediately and forever. Keeping
            # parts Compact (all columns in one file) makes Horizontal cheap: 122 MiB
            # measured, against 3.58 GiB for the Wide case.
            #
            # Deliberately NOT solved by forcing vertical merges. TTLDropMerge and
            # TTLDeleteMerge are always forced to Horizontal on 25.12.5.44 - the setting
            # that would allow otherwise, vertical_merge_optimize_ttl_delete, does not exist
            # in this build. Forcing vertical therefore rescues ordinary merges while TTL
            # merges keep failing, and the deadlock returns about a day later, once the
            # first Wide part expires. That was measured: 468 of 468 TTL merges failed.
            #
            # Trade-off: a Compact part decompresses its shared block to read one column, so
            # column-selective queries on metric_log are slower than they would be on Wide
            # parts. Nothing queries this self-monitoring table, so that cost is not paid.
            #
            # 10 GiB / 100M are not tuned values. They only need to exceed anything a 1-day
            # TTL can accumulate here (about 242 MB/day), i.e. they mean "never Wide".
            #
            # Escape hatch if TTL merges ever fail again: metric_log.schema_type = transposed
            # turns the table into 6 columns and removes the failure class entirely (verified
            # to work on 25.12.5.44). It changes the table shape, so do it as its own change.
            #
            # Declared via 'engine' because SETTINGS can only be given inside it, which forces
            # the TTL in here too; the now-duplicate 'ttl' key is removed by the last patch.
            metric_log:
              engine: |
                ENGINE = MergeTree
                PARTITION BY toYYYYMM(event_date)
                ORDER BY (event_date, event_time)
                TTL event_date + INTERVAL 1 DAY DELETE
                SETTINGS min_bytes_for_wide_part = 10737418240,
                         min_rows_for_wide_part = 100000000,
                         vertical_merge_algorithm_min_rows_to_activate = 1000

            # User-level setting: it must sit under profiles. At the top level ClickHouse crashes.
            profiles:
              default:
                max_bytes_before_external_group_by: 1610612736   # spill to disk past 1.5 GiB

  # mem_limit and cpus are Docker Compose fields that Foundry does not model, so they have
  # to go through patches. Setting memswap_limit equal to mem_limit disables swap for the
  # container, so memory pressure surfaces as an error rather than as silent thrashing.
  patches:
    - target: "deployment/compose.yaml"
      operations:
        - op: add
          path: /services/signoz-telemetrystore-clickhouse-0-0/mem_limit
          value: "6g"
        - op: add
          path: /services/signoz-telemetrystore-clickhouse-0-0/memswap_limit
          value: "6g"
        - op: add
          path: /services/signoz-telemetrystore-clickhouse-0-0/cpus
          value: 4.0

        - op: add
          path: /services/signoz-signoz-0/mem_limit
          value: "2g"
        - op: add
          path: /services/signoz-signoz-0/memswap_limit
          value: "2g"
        - op: add
          path: /services/signoz-signoz-0/cpus
          value: 2.0

        - op: add
          path: /services/ingester/mem_limit
          value: "1g"
        - op: add
          path: /services/ingester/memswap_limit
          value: "1g"
        - op: add
          path: /services/ingester/cpus
          value: 2.0

        - op: add
          path: /services/signoz-metastore-postgres-0/mem_limit
          value: "1g"
        - op: add
          path: /services/signoz-metastore-postgres-0/memswap_limit
          value: "1g"
        - op: add
          path: /services/signoz-metastore-postgres-0/cpus
          value: 1.0

        - op: add
          path: /services/signoz-telemetrykeeper-clickhousekeeper-0/mem_limit
          value: "1g"
        - op: add
          path: /services/signoz-telemetrykeeper-clickhousekeeper-0/memswap_limit
          value: "1g"
        - op: add
          path: /services/signoz-telemetrykeeper-clickhousekeeper-0/cpus
          value: 1.0

        # Docker's json-file driver has no rotation by default, so any repeating error can
        # fill the host disk - which is exactly how one merge loop cost 259 GB here. Cap at
        # 150 MB per service. This is insurance against the next unknown bug, not a fix.
        - op: add
          path: /services/signoz-telemetrystore-clickhouse-0-0/logging
          value: &logging
            driver: json-file
            options:
              max-size: "50m"
              max-file: "3"
        - op: add
          path: /services/signoz-signoz-0/logging
          value: *logging
        - op: add
          path: /services/ingester/logging
          value: *logging
        - op: add
          path: /services/signoz-metastore-postgres-0/logging
          value: *logging
        - op: add
          path: /services/signoz-telemetrykeeper-clickhousekeeper-0/logging
          value: *logging

    # Foundry deep-merges config, so the 'ttl' key it generates for metric_log survives
    # alongside the 'engine' added above. ClickHouse rejects a config carrying both and
    # refuses to start (exit 36). The TTL already lives inside the engine string, so drop
    # the now-redundant key here.
    - target: "deployment/telemetrystore/clickhouse/config-0-0.yaml"
      operations:
        - op: remove
          path: /metric_log/ttl
